<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | MovieDB</title>

    <link href="/src/output.css" rel="stylesheet" />
  </head>

  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <!-- Main Card -->
    <div
      class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden grid md:grid-cols-2"
    >
      <!-- Left Side -->
      <div class="bg-blue-950 text-white p-10 flex flex-col justify-center">
        <h1 class="text-5xl font-bold mb-4">🎬 MovieDB</h1>

        <p class="text-blue-200 text-lg leading-8">
          Store, organize and manage your favourite movies in one place.
        </p>

        <div class="mt-10 space-y-5">
          <div class="flex items-center gap-3">
            <span class="text-2xl">🎥</span>
            <p>Save unlimited movies</p>
          </div>

          <div class="flex items-center gap-3">
            <span class="text-2xl">❤️</span>
            <p>Create your favourites collection</p>
          </div>

          <div class="flex items-center gap-3">
            <span class="text-2xl">🔍</span>
            <p>Search movies instantly</p>
          </div>
        </div>
      </div>

      <!-- Right Side -->
      <div class="p-10">
        <h2 class="text-3xl font-bold text-slate-800 mb-2">Create Account</h2>

        <p class="text-slate-500 mb-8">
          Create your MovieDB account to continue.
        </p>

        <form id="signupForm" class="space-y-6">
          <div>
            <label class="block mb-2 font-semibold text-slate-700">
              Username
            </label>

            <input
              type="text"
              id="username"
              placeholder="Enter your username"
              class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-900"
            />
          </div>

          <div>
            <label class="block mb-2 font-semibold text-slate-700">
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-900"
            />
          </div>

          <div>
            <label class="block mb-2 font-semibold text-slate-700">
              Password
            </label>

            <input
              type="password"
              id="password"
              placeholder="Create password"
              class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-900"
            />
          </div>

          <div>
            <label class="block mb-2 font-semibold text-slate-700">
              Confirm Password
            </label>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm password"
              class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-900"
            />
          </div>

          <!-- Error Message -->

          <p id="message" class="text-red-500 text-sm"></p>

          <button
            type="submit"
            class="w-full bg-blue-950 text-white py-3 rounded-xl font-semibold hover:bg-blue-900 transition cursor-pointer"
          >
            Create Account
          </button>
        </form>

        <div class="text-center mt-8">
          <p class="text-slate-600">
            Already have an account?

            <a
              href="login.html"
              class="text-blue-900 font-semibold hover:underline"
            >
              Login
            </a>
          </p>
        </div>
      </div>
    </div>

    <script src="/Script/auth.js"></script>
  </body>
</html>
